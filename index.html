<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFCBOARD · Coming soon</title>
  <meta name="description" content="NFCBOARD is a board for the bridge table that records every bid, every card played and the final score. Coming soon.">
  <link rel="icon" type="image/svg+xml" href="assets/nfcboard-icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NFCBOARD · Coming soon">
  <meta property="og:description" content="A board for the bridge table that records every bid, every card played and the final score.">
  <meta property="og:url" content="https://nfcboard.ch/">
  <meta property="og:image" content="https://nfcboard.ch/assets/share-image.png">
  <meta name="theme-color" content="#1F6E54">
  <style>
    :root {
      --cream: #F6F1E7;
      --navy: #12283F;
      --green: #1F6E54;
      --red: #D9473E;
      --muted: #5A6878;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--cream);
      color: var(--navy);
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      min-height: 100vh;
    }
    .icon { width: 140px; height: 140px; margin-bottom: 28px; }
    .wordmark {
      font-size: clamp(44px, 11vw, 76px);
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .wordmark b { font-weight: 800; }
    .wordmark span { font-weight: 300; }
    .tag {
      margin-top: 22px;
      font-size: clamp(17px, 4.2vw, 20px);
      line-height: 1.5;
      max-width: 32em;
      color: var(--navy);
    }
    .soon {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--green);
      color: var(--cream);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .contact { margin-top: 28px; font-size: 16px; color: var(--muted); }
    .contact a { color: var(--green); font-weight: 600; text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
    footer { position: absolute; bottom: 20px; font-size: 13px; color: var(--muted); }
    @media (max-height: 560px) { footer { position: static; margin-top: 32px; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <img class="icon" src="assets/nfcboard-icon.svg" alt="">
  <h1 class="wordmark"><b>NFC</b><span>BOARD</span></h1>
  <p class="tag">A board for the bridge table that records every bid, every card played and the final score.</p>
  <p class="soon">Coming soon</p>
  <!-- CONTACT: when the email address is ready, remove the two comment lines around the paragraph below and put the address in both places -->
  <!--
  <p class="contact">Questions? Write to <a href="mailto:EMAIL">EMAIL</a></p>
  -->
  <footer>&copy; 2026 NFCBOARD</footer>
</body>
</html>
