<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFCBOARD · Coming soon</title>
  <meta name="description" content="NFCBOARD is a board for the bridge table that records every bid, every card played and the final score. Coming soon.">
  <link rel="icon" type="image/svg+xml" href="assets/nfcboard-icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NFCBOARD · Coming soon">
  <meta property="og:description" content="A board for the bridge table that records every bid, every card played and the final score.">
  <meta property="og:url" content="https://nfcboard.ch/">
  <meta property="og:image" content="https://nfcboard.ch/assets/share-image.png">
  <meta name="theme-color" content="#1F6E54">
  <style>
    :root {
      --cream: #F6F1E7;
      --navy: #12283F;
      --green: #1F6E54;
      --red: #D9473E;
      --muted: #5A6878;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--navy);
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 88px 16px 32px;
      position: relative;
      min-height: 100vh;
    }
    .brand {
      position: absolute; top: 20px; left: 24px;
      display: flex; align-items: center; gap: 10px;
      font-size: 22px; letter-spacing: 0.03em; line-height: 1;
    }
    .brand img { width: 36px; height: 36px; }
    .brand b { font-weight: 800; }
    .brand span { font-weight: 300; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .tag {
      margin-top: 36px;
      font-size: clamp(17px, 4.2vw, 20px);
      line-height: 1.5;
      max-width: 32em;
      color: var(--navy);
    }
    .soon {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--green);
      color: var(--cream);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .contact { margin-top: 28px; }
    .contact img { display: block; margin: 0 auto; }
    .exploded { width: 100%; max-width: 620px; height: auto; }
    footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="brand"><img src="assets/nfcboard-icon.svg" alt=""><div><b>NFC</b><span>BOARD</span></div></div>
  <h1>NFCBOARD</h1>
  <img class="exploded" src="assets/board-exploded.svg" alt="Exploded view of the board in four layers: top panel, frame, chip with card readers, bottom panel">
  <p class="tag">A board for the bridge table that records every bid, every card played and the final score.</p>
  <p class="soon">Coming soon</p>
  <p class="contact"><img src="assets/email.png" alt="Email address" width="142" height="24"></p>
  <footer>&copy; 2026 NFCBOARD</footer>
</body>
</html>
